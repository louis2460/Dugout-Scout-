<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dugout Scout: baseball scouting reports from GameChanger</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#e7ece6; --panel:#ffffff; --ink:#15241c; --muted:#56675d; --line:#cdd6ce; --soft:#f1f4f0;
  --board:#15241c; --board-ink:#f4f7f2; --board-muted:#b9c8bf; --hit:#f2c014; --hit-ink:#2a2100; --cs:#d9472f;
  --grass:#2e6a3e; --grass2:#357548; --dirt:#b5875b; --chalk:#f4f7f2; color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1813;--panel:#16241d;--ink:#e4ede6;--muted:#9bb0a3;--line:#2a3c33;--soft:#1c2c24;--board:#0a120e;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0e1813;--panel:#16241d;--ink:#e4ede6;--muted:#9bb0a3;--line:#2a3c33;--soft:#1c2c24;--board:#0a120e;color-scheme:dark}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 "Source Sans 3",system-ui,-apple-system,"Segoe UI",sans-serif}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--board)}
.wrap{max-width:1180px;margin:0 auto;padding:0 20px 48px}
header.board{background:var(--board);color:var(--board-ink)}
header.board .wrap{padding-top:16px;padding-bottom:0}
.topbar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.brand{font:700 20px/1 "Barlow Condensed",Impact,"Arial Narrow",sans-serif;color:var(--hit);text-decoration:none;letter-spacing:.3px}
.toplinks{display:flex;gap:8px;flex-wrap:wrap}
.btn{font:600 15px "Source Sans 3",sans-serif;border:1px solid var(--line);background:var(--soft);color:var(--ink);padding:8px 14px;cursor:pointer;text-decoration:none;display:inline-block}
.btn.primary{background:var(--hit);color:var(--hit-ink);border-color:var(--hit)}
.btn.ghost{background:transparent;color:var(--board-ink);border-color:#3a4f43}
.btn:disabled{opacity:.5;cursor:not-allowed}
h1{font:700 clamp(34px,6vw,58px)/0.95 "Barlow Condensed",Impact,"Arial Narrow",sans-serif;margin:18px 0 0;letter-spacing:.5px}
.sub{color:var(--board-muted);font-size:15px;margin:6px 0 0}
nav.tabs{display:flex;gap:2px;margin-top:18px;overflow-x:auto;scrollbar-width:none}
nav.tabs a{font:600 19px/1 "Barlow Condensed",sans-serif;color:#c9d6ce;text-decoration:none;padding:12px 16px 13px;white-space:nowrap;border-top:3px solid transparent}
nav.tabs a:hover{color:#fff}
nav.tabs a[aria-current="page"]{background:var(--bg);color:var(--ink);border-top-color:var(--hit)}
a:focus-visible,button:focus-visible,select:focus-visible,textarea:focus-visible,input:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--hit);outline-offset:2px}
.layout{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:24px;margin-top:24px}
@media (max-width:860px){.layout{grid-template-columns:1fr}}
.stage,.card,.below{background:var(--panel);border:1px solid var(--line);padding:16px}
.below{margin-top:24px}
.stage h2,.side h2,.below h2,.card h2{font:600 26px/1.1 "Barlow Condensed",sans-serif;margin:0 0 4px}
.note{color:var(--muted);font-size:14px;margin:0 0 10px}
.filters{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin:0 0 12px}
.filters label{font-size:14px;color:var(--muted);display:flex;gap:6px;align-items:center}
select,input[type=text]{font:inherit;font-size:15px;color:var(--ink);background:var(--soft);border:1px solid var(--line);padding:6px 8px;min-width:170px}
textarea{width:100%;min-height:180px;font:14px/1.45 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:var(--ink);background:var(--soft);border:1px solid var(--line);padding:10px;resize:vertical}
.seg{display:inline-flex;border:1px solid var(--line);flex-wrap:wrap}
.seg button{font:600 15px "Source Sans 3",sans-serif;background:var(--soft);color:var(--ink);border:0;padding:6px 12px;cursor:pointer}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--board);color:var(--hit)}
svg.field{width:100%;height:auto;display:block}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:14px;color:var(--muted);margin-top:10px}
.legend i{display:inline-block;width:12px;height:12px;border-radius:50%;vertical-align:-1px;margin-right:5px}
.side{display:flex;flex-direction:column;gap:16px}
.plan{background:var(--board);color:var(--board-ink);padding:18px 18px 8px}
.plan h2{color:var(--hit)}
.plan .who{color:var(--board-muted);font-size:14px;margin:0 0 10px}
.plan ol{margin:0;padding:0 0 0 20px}
.plan li{margin:0 0 10px}
.plan li b{color:#fff}
.card h3{font:600 20px/1.2 "Barlow Condensed",sans-serif;margin:0 0 8px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stats div{background:var(--soft);padding:8px 10px}
.stats b{display:block;font:700 26px/1 "Barlow Condensed",sans-serif}
.stats span{font-size:13px;color:var(--muted)}
.tablewrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:15px}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-weight:600;color:var(--muted);background:var(--soft);white-space:nowrap}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
.tag{display:inline-block;font:700 15px "Barlow Condensed",sans-serif;padding:1px 7px;background:var(--soft);border:1px solid var(--line)}
.tag.on{background:var(--hit);color:var(--hit-ink);border-color:var(--hit)}
.tag.sm{font-size:12px;padding:0 4px}
tr.pick{cursor:pointer}
tr.pick:hover td{background:var(--soft)}
.tip{position:absolute;pointer-events:none;background:var(--board);color:var(--board-ink);padding:6px 10px;font-size:14px;max-width:260px;z-index:20;display:none;border-left:3px solid var(--hit)}
[data-tip]{cursor:pointer;-webkit-tap-highlight-color:transparent}
svg.field :not([data-tip]){pointer-events:none}
.grid{display:grid;grid-template-columns:auto repeat(4,1fr);gap:6px}
.grid .h{font-size:13px;color:var(--muted);text-align:center;align-self:end}
.grid .r{font-size:13px;color:var(--muted);align-self:center;padding-right:4px}
.cell{padding:10px 6px;text-align:center;border:1px solid var(--line)}
.cell b{display:block;font:700 28px/1 "Barlow Condensed",sans-serif}
.cell span,.cell small{font-size:13px;color:var(--muted)}
.cell small{display:block;font-size:12px;margin-top:4px}
.tiles{display:flex;flex-wrap:wrap;gap:3px;justify-content:center;margin-top:6px}
.tiles em{font:700 12px/18px "Barlow Condensed",sans-serif;font-style:normal;width:18px;height:18px;text-align:center;border:1px solid var(--line);color:var(--muted)}
.tiles em.sw{background:var(--hit);border-color:var(--hit);color:var(--hit-ink)}
.bars div{display:grid;grid-template-columns:150px 1fr 60px;gap:10px;align-items:center;margin:8px 0;font-size:15px}
.bars .track{background:var(--soft);height:18px;position:relative}
.bars .fill{position:absolute;inset:0 auto 0 0;background:var(--cs)}
.bars .fill.ok{background:var(--grass2)}
.steps{display:grid;gap:16px;margin-top:24px}
.game{border:1px solid var(--line);background:var(--panel);padding:14px}
.game header{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:8px;flex-wrap:wrap}
.game header input{min-width:240px}
.ok{color:var(--grass2);font-weight:600}
.err{color:var(--cs);font-weight:600}
.reports{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.report{border:1px solid var(--line);background:var(--panel);padding:14px;display:flex;flex-direction:column;gap:6px}
.report h3{font:600 22px/1.1 "Barlow Condensed",sans-serif;margin:0}
.report .actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:auto}
.choice{display:flex;flex-wrap:wrap;gap:8px}
.choice label{border:1px solid var(--line);padding:8px 12px;background:var(--soft);cursor:pointer;display:flex;gap:8px;align-items:center}
footer{color:var(--muted);font-size:14px;margin-top:28px}
.empty{padding:28px;text-align:center;color:var(--muted)}
@media print{header.board .toplinks,nav.tabs,.filters,.btn{display:none!important}body{background:#fff}}
</style>
</head>
<body>
<header class="board"><div class="wrap" id="head"></div></header>
<main class="wrap" id="app"></main>
<div class="tip" id="tip" role="status"></div>
<script>
/* Scouting engine: reads GameChanger play-by-play text and builds a scouting model. */
const ENGINE = (() => {
  const POS = {'pitcher':1,'catcher':2,'first baseman':3,'second baseman':4,'third baseman':5,'shortstop':6,'left fielder':7,'center fielder':8,'right fielder':9};
  const POS_RE = /(pitcher|catcher|first baseman|second baseman|third baseman|shortstop|left fielder|center fielder|right fielder)/g;
  const SPOT = {1:[45,.2],2:[45,.07],3:[82,.36],4:[62,.48],5:[8,.36],6:[28,.48],7:[18,.75],8:[45,.8],9:[72,.75]};
  const HALF_RE = /^(Top|Bottom)\s+(\d+)(?:st|nd|rd|th)\s*-\s*(.+)$/i;
  const OUTS_RE = /^(\d)\s+Outs?$/i;
  const SCORE_RE = /^[A-Za-z0-9.&' ]+\s\d+\s-\s[A-Za-z0-9.&' ]+\s\d+(?:\s*\|\s*(\d)\s+Outs?)?$/;
  const VERB_RE = /^(.+?)\s(singles|doubles|triples|homers|hits a (?:home run|grand slam|ground ball|pop fly|line drive|fly ball|hard ground ball)|grounds|lines|flies|pops|strikes out|walks|is intentionally walked|is hit by pitch|out on|sacrifices|bunts|reaches|out at first|is out|hits into|hit by pitch)\b/;
  const ord = n => n + (n%10===1&&n%100!==11?'st':n%10===2&&n%100!==12?'nd':n%10===3&&n%100!==13?'rd':'th');

  function posList(str){ const out=[]; let m; POS_RE.lastIndex=0; while((m=POS_RE.exec(str))) out.push(POS[m[1]]); return out; }

  function parsePitches(line){
    const toks = line.replace(/\.\s*$/,'').split(/,\s*/);
    const seq=[], runs=[], changes=[];
    let wp=0, pb=0, scores=0;
    toks.forEach(raw => {
      const t = raw.trim();
      let m;
      if (/^Ball\s+\d+$/i.test(t)) seq.push('B');
      else if (/^Strike\s+\d+\s+looking$/i.test(t)) seq.push('C');
      else if (/^Strike\s+\d+\s+swinging$/i.test(t)) seq.push('S');
      else if (/^Strike\s+\d+$/i.test(t)) seq.push('C');
      else if (/^Foul(\s+bunt|\s+tip)?$/i.test(t)) seq.push('F');
      else if (/^In play$/i.test(t)) seq.push('X');
      else if ((m = t.match(/^(.+?)\s+steals\s+(2nd|3rd|home)/i))) runs.push({kind:'SB', r:m[1], to:m[2], at:seq.length});
      else if ((m = t.match(/^(.+?)\s+caught stealing\s+(2nd|3rd|home)/i))) runs.push({kind:'CS', r:m[1], to:m[2], at:seq.length});
      else if ((m = t.match(/^(.+?)\s+picked off at\s+(1st|2nd|3rd)/i))) runs.push({kind:'PO', r:m[1], to:m[2], at:seq.length});
      else if ((m = t.match(/^(.+?)\s+in for pitcher\s+(.+)$/i))) changes.push(m[2].trim().replace(/\.$/,''));
      else if ((m = t.match(/^Lineup changed:\s*(.+?)\s+in at pitcher/i))) changes.push(m[1].trim().replace(/\.$/,''));
      if (/on wild pitch/i.test(t)) { wp++; m=t.match(/^(.+?)\s+(advances to|scores)/i); if(m) runs.push({kind:'WP', r:m[1], to:/scores/i.test(t)?'home':(t.match(/to (2nd|3rd)/i)||[])[1], at:seq.length}); }
      if (/on passed ball/i.test(t)) { pb++; m=t.match(/^(.+?)\s+(advances to|scores)/i); if(m) runs.push({kind:'PB', r:m[1], to:/scores/i.test(t)?'home':(t.match(/to (2nd|3rd)/i)||[])[1], at:seq.length}); }
      if (/\sscores\b/i.test(t)) scores++;
    });
    return {seq, runs, changes, wp, pb, scores};
  }

  function blocksFrom(lines){
    const halves=[]; let half=null, ev=null;
    for (const raw of lines){
      const line = raw.trim(); if(!line) continue;
      let m = line.match(HALF_RE);
      if (m){ half={top:/^top$/i.test(m[1]), inning:+m[2], bat:m[3].trim(), events:[]}; halves.push(half); ev=null; continue; }
      if (!half) continue;
      if (/\sat bat$/i.test(line)) continue;
      if (OUTS_RE.test(line) || SCORE_RE.test(line)){ if(ev){ const o=line.match(OUTS_RE)||line.match(SCORE_RE); if(o&&o[1]!==undefined) ev.outsAfter=+o[1]; } continue; }
      const isText = /\.$/.test(line) || /,/.test(line);
      if (!isText){ ev={title:line, lines:[]}; half.events.push(ev); continue; }
      if (ev) ev.lines.push(line);
    }
    return halves;
  }

  function looksLikePitches(line){
    const toks=line.replace(/\.\s*$/,'').split(/,\s*/);
    return toks.some(t=>/^(Ball|Strike|Foul|In play)\b/i.test(t.trim())) || /^(Ball|Strike|Foul|In play|Pickoff|Courtesy|Lineup changed)/i.test(line);
  }

  function notation(ev, desc){
    const t = ev.title.toLowerCase();
    const chunks = desc.replace(/\.\s*$/,'').split(/,\s*/);
    let chain = posList(chunks[0]);
    for (let i=1;i<chunks.length;i++){ if (/^(pitcher|catcher|first baseman|second baseman|third baseman|shortstop|left fielder|center fielder|right fielder)\b/i.test(chunks[i])) chain = chain.concat(posList(chunks[i])); else break; }
    const errM = desc.match(/error by (pitcher|catcher|first baseman|second baseman|third baseman|shortstop|left fielder|center fielder|right fielder)/i);
    const errTail = (!/^error$/.test(t) && errM) ? ', E'+POS[errM[1].toLowerCase()] : '';
    const bunt = /bunt/i.test(desc);
    const rbi = chunks.slice(1).filter(c=>/\sscores\b/i.test(c) && !/error/i.test(c)).length + (/home run/.test(t)?1:0);
    const rbiTag = rbi && !/^error$/.test(t) ? (rbi>1?` (${rbi} RBI)`:' (RBI)') : '';
    const first = chain[0];
    let res;
    if (/^single$/.test(t)) res='1B'+(first?'-'+first:'');
    else if (/^double$/.test(t)) res='2B'+(first?'-'+first:'');
    else if (/^triple$/.test(t)) res='3B'+(first?'-'+first:'');
    else if (/home run/.test(t)){ res='HR'; const fm=desc.match(/(left|center|right)[- ]?(?:center |field|fielder)/i); if(!chain.length&&fm) chain=[{left:7,center:8,right:9}[fm[1].toLowerCase()]]; }
    else if (/intentional walk/.test(t)) res='IBB';
    else if (/^walk$/.test(t)) res='BB';
    else if (/hit by pitch/.test(t)) res='HBP';
    else if (/dropped 3rd/.test(t)) res=/looking/i.test(desc)?'ꓘ (D3)':'K (D3)';
    else if (/strikeout/.test(t)) res=/looking/i.test(desc)?'ꓘ':'K';
    else if (/ground out/.test(t)) res= chain.length>1 ? chain.join('-') : (first? first+'U':'GO');
    else if (/line out/.test(t)) res='L'+(first||'');
    else if (/fly out/.test(t)) res='F'+(first||'');
    else if (/pop out/.test(t)) res='P'+(first||'');
    else if (/sacrifice fly/.test(t)) res='SF'+(first||'');
    else if (/sacrifice bunt|sacrifice/.test(t)) res='SAC'+(chain.length?' '+chain.join('-'):'');
    else if (/fielder.?s choice/.test(t)) res='FC'+(chain.length?' '+chain.join('-'):'');
    else if (/double play/.test(t)) res=(/lines into|line drive/i.test(desc)?'L':'')+(chain.length?chain.join('-')+' ':'')+'DP';
    else if (/triple play/.test(t)) res=(/lines into|line drive/i.test(desc)?'L':'')+(chain.length?chain.join('-')+' ':'')+'TP';
    else if (/^error$/.test(t)) res= errM ? 'E'+POS[errM[1].toLowerCase()] : 'E';
    else res=ev.title;
    if (bunt && /^(1B|E)/.test(res)) res+=' (bunt)';
    return {res: res+errTail+rbiTag, chain, rbi};
  }

  function battedType(title, desc){
    const d=desc.toLowerCase(), t=title.toLowerCase();
    if (/bunt|sacrifices to/.test(d) || /sacrifice bunt/.test(t)) return 'BU';
    if (/pop fly|pops out/.test(d)) return 'PU';
    if (/line drive|lines out|lines into/.test(d)) return 'LD';
    if (/fly ball|flies out|sacrifice fly/.test(d)) return 'FB';
    if (/ground ball|grounds|ground into/.test(d)) return 'GB';
    if (/home run/.test(t)) return 'FB';
    return null;
  }

  function spot(res, type, chain){
    const p = chain[0];
    if (/^HR/.test(res)) return [p?SPOT[p][0]:45,1.06];
    if (!p) return type==='BU'?[45,.12]:null;
    let [a,d] = SPOT[p];
    const outfield = p>=7;
    if (/^1B/.test(res)) d = outfield ? (type==='GB'?.62:.7) : (p<=2?.2:.5);
    else if (/^2B/.test(res)) d = outfield ? .92 : .5;
    else if (/^3B/.test(res)) d = outfield ? .98 : .5;
    if (type==='BU') d = Math.min(d,.22);
    return [a,d];
  }

  function parseGame(text, label){
    const halves = blocksFrom(text.split(/\r?\n/));
    if (!halves.length) return {ok:false, error:'No innings found. Paste the play-by-play starting with a line like “Top 1st - Team Name”.'};
    const rank = h => h.inning*2 + (h.top?0:1);
    if (rank(halves[0]) > rank(halves[halves.length-1])) { halves.reverse(); halves.forEach(h=>h.events.reverse()); }
    else if (halves.length===1 && halves[0].events.length>1) { /* single half: leave as is */ }
    const teams=[...new Set(halves.map(h=>h.bat))];
    const out={ok:true, label, teams, halves:[]};
    for (const h of halves){
      let outs=0; const H={top:h.top, inning:h.inning, bat:h.bat, events:[]};
      for (const ev of h.events){
        if (!ev.lines.length) continue;
        let pitchLine='', desc='';
        if (ev.lines.length>=2){ pitchLine=ev.lines[0]; desc=ev.lines[ev.lines.length-1]; }
        else if (looksLikePitches(ev.lines[0])) pitchLine=ev.lines[0]; else desc=ev.lines[0];
        const P = pitchLine ? parsePitches(pitchLine) : {seq:[],runs:[],changes:[],wp:0,pb:0,scores:0};
        if (/hit by pitch/i.test(ev.title)) P.seq.push('H');
        const vm = desc.match(VERB_RE);
        const batter = vm ? vm[1].trim() : null;
        const N = desc ? notation(ev, desc) : {res:ev.title, chain:[], rbi:0};
        const type = desc ? battedType(ev.title, desc) : null;
        const inPlay = P.seq[P.seq.length-1]==='X';
        const outsBefore = outs;
        const outsAfter = ev.outsAfter!==undefined ? ev.outsAfter : outs;
        outs = outsAfter;
        const pm = desc.match(/,\s*([^,]+?)\s+pitching\b/);
        const fieldP = desc.match(/\bpitcher\s+([A-Z][\w'.-]+(?:\s+[A-Z][\w'.-]+)+)/);
        const descScores = (desc.match(/\sscores\b/g)||[]).length;
        const descRuns = [];
        desc.replace(/\.\s*$/,'').split(/,\s*/).slice(1).forEach(c=>{ let m;
          if ((m=c.match(/^(.+?)\s+out advancing to\s+(2nd|3rd|home|1st)/i))) descRuns.push({kind:'OA', r:m[1], to:m[2]});
          else if ((m=c.match(/^(.+?)\s+held up at\s+(2nd|3rd)/i))) descRuns.push({kind:'HELD', r:m[1], to:m[2]});
          else if ((m=c.match(/^(.+?)\s+advances to\s+(2nd|3rd)\s+on (?:an\s+)?error/i))) descRuns.push({kind:'E', r:m[1], to:m[2]});
        });
        const scorers=[]; (pitchLine+', '+desc).split(/,\s*/).forEach(c=>{const m=c.match(/^(.+?)\s+scores\b/i); if(m) scorers.push(m[1].trim());}); const isHR=/home run/i.test(ev.title); if(isHR&&batter) scorers.push(batter);
        H.events.push({
          title:ev.title, desc, pitchLine, batter, seq:P.seq.join(''), runs:P.runs, descRuns, changes:P.changes,
          res:N.res, chain:N.chain, rbi:N.rbi, type, inPlay, spot: inPlay && type ? spot(N.res,type,N.chain) : null,
          outsBefore, outsAfter, outsMade: Math.max(0,outsAfter-outsBefore),
          wp:P.wp, pb:P.pb, runsScored: P.scores+descScores+(isHR?1:0), scorers,
          pitcherNamed: pm ? pm[1].trim().replace(/\.$/,'') : (fieldP ? fieldP[1].trim().replace(/\.$/,'') : null)
        });
      }
      out.halves.push(H);
    }
    return out;
  }

  /* Build the scouting model for one opponent across many games */
  function build(games, opp, opts){
    const EX = new Set((opts&&opts.exclude)||[]);
    const SW = c => c==='S'||c==='F'||c==='X';
    const pas=[], bip=[], steals=[], other=[], hitters={}, pitchers={}, scored={};
    const defense={sbAgainst:0, csAgainst:0, pb:0, wp:0, errors:0, catcher:null, oppErrors:[]};
    games.forEach((g,gi)=>{
      const gl = g.label || ('G'+(gi+1));
      let lastP = null;
      // assign pitchers for halves where opp is fielding
      const fielding = g.halves.filter(h=>h.bat!==opp);
      const flat = []; fielding.forEach(h=>h.events.forEach(e=>flat.push(e)));

  function pct(a,n){ return n?Math.round(a/n*100):0; }

    else if (H.bip>=2 && H.right/H.bip>=0.6) s=`Shade him to the right side. ${H.right} of ${H.bip} balls in play went to first, second or right.`;
    else s=`Play him straight up. ${H.left} left, ${H.mid} middle, ${H.right} right.`;

function outList(id){ const R=roster(id); return R.removed.concat(R.deleted); }
function saveRoster(){ store.set(ROSTER,rosters); }
function pinfo(n){ return roster().info[n]||{}; }
function label(n){ const i=pinfo(n); return (i.num?'#'+i.num+' ':'')+n; }
function stubHitter(n){ const i=pinfo(n); return {name:n,line:'No plate appearances yet',read:'No plate appearances yet.',shade:'No balls in play yet.',pa:[],swings:0,pitches:0,fps:0,fp:0,bip:0}; }

function allReports(){ return [SAMPLE].concat(reports); }
function activeReport(){ const id=store.get(ACTIVE,SAMPLE.id); return allReports().find(r=>r.id===id)||SAMPLE; }
function setActive(id){ store.set(ACTIVE,id); model=null; fullModel=null; state={game:'all',hitter:'all',runner:'all'}; }
function getFull(){ const r=activeReport(), key=r.id+'|'+r.games.length; if(!fullModel||fullId!==key){ const parsed=r.games.map((g,i)=>ENGINE.parseGame(g.text,g.label||('G'+(i+1)))).filter(p=>p.ok); fullModel=ENGINE.build(parsed,r.opp); fullId=key; } return fullModel; }
function hitterNames(M){ const R=roster(); const names=Object.keys(M.hitters); R.added.forEach(n=>{ if(!names.includes(n) && !R.removed.includes(n) && !R.deleted.includes(n)) names.push(n); }); return names; }
function hitterOf(M,n){ return M.hitters[n]||stubHitter(n); }
function getModel(){
  const r=activeReport();
  const key=r.id+'|'+r.games.length+'|'+outList(r.id).join(',');
  if (!model || modelId!==key){
    const parsed=r.games.map((g,i)=>ENGINE.parseGame(g.text, g.label||('G'+(i+1)))).filter(p=>p.ok);
    model=ENGINE.build(parsed, r.opp, {exclude:outList(r.id)}); modelId=key;

}

const HX=300,HY=470,R=410;
const pt=(a,d)=>{const t=(135-a)*Math.PI/180;return [HX+R*d*Math.cos(t),HY-R*d*Math.sin(t)];};
const BASE={0:pt(0,0),1:pt(90,.3),2:pt(45,.4243),3:pt(0,.3),4:pt(0,0)};
function fieldSVG(inner,label,vb){
  const [lx,ly]=pt(0,1),[rx,ry]=pt(90,1),[ilx,ily]=pt(0,.55),[irx,iry]=pt(90,.55),[mx,my]=pt(45,.21);
  const stripes=[.2,.4,.6,.8].map(d=>{const [a,b]=pt(0,d+.1),[c,e]=pt(90,d+.1),[f,g]=pt(0,d),[h,j]=pt(90,d);return `<path d="M${f},${g} A${R*d},${R*d} 0 0 1 ${h},${j} L${c},${e} A${R*(d+.1)},${R*(d+.1)} 0 0 0 ${a},${b} Z" fill="var(--grass2)"/>`}).join('');
  const bases=[1,2,3].map(b=>{const [x,y]=BASE[b];return `<rect x="${x-7}" y="${y-7}" width="14" height="14" fill="var(--chalk)" transform="rotate(45 ${x} ${y})"/>`}).join('');
  return `<svg class="field" viewBox="${vb||'0 0 600 500'}" role="img" aria-label="${esc(label)}">
  <path d="M${HX},${HY} L${lx},${ly} A${R},${R} 0 0 1 ${rx},${ry} Z" fill="var(--grass)"/>${stripes}
  <path d="M${HX},${HY} L${ilx},${ily} A${R*.55},${R*.55} 0 0 1 ${irx},${iry} Z" fill="var(--dirt)"/><circle cx="${HX}" cy="${HY-6}" r="22" fill="var(--dirt)"/>
  <path d="M${BASE[0][0]},${BASE[0][1]-30} L${BASE[1][0]-28},${BASE[1][1]} L${BASE[2][0]},${BASE[2][1]+30} L${BASE[3][0]+28},${BASE[3][1]} Z" fill="var(--grass)"/>
  <circle cx="${mx}" cy="${my}" r="15" fill="var(--dirt)"/>
  <path d="M${HX},${HY} L${lx},${ly} M${HX},${HY} L${rx},${ry}" stroke="var(--chalk)" stroke-width="2"/>
  <path d="M${HX},${HY} L${BASE[1][0]},${BASE[1][1]} L${BASE[2][0]},${BASE[2][1]} L${BASE[3][0]},${BASE[3][1]} Z" fill="none" stroke="var(--chalk)" stroke-width="1.5" opacity=".7"/>
  ${bases}<path d="M${HX-7},${HY-4} h14 v6 l-7,6 l-7,-6 Z" fill="var(--chalk)"/>${inner}</svg>`;
}
function sprayField(list){
  const seen=[];
  const dots=list.map(b=>{
    const k=seen.filter(q=>Math.abs(q.a-b.a)<4&&Math.abs(q.d-b.d)<.06).length; seen.push(b);
    let [x,y]=pt(b.a,b.d); if(k){x+=[0,15,-15][k%3];y-=Math.floor(k/3)*15;}
    const fill=b.on?'var(--hit)':'#ffffff', stroke=b.on?'#5c4600':'#1d3a26';
    const tl={GB:'Ground ball',LD:'Line drive',FB:'Fly ball',PU:'Pop-up',BU:'Bunt'}[b.type]||'';
    const sh=b.type==='LD'?`<path d="M${x},${y-8} L${x+8},${y+6} L${x-8},${y+6} Z"`:(b.type==='FB'||b.type==='PU')?`<rect x="${x-7}" y="${y-7}" width="14" height="14"`:b.type==='BU'?`<rect x="${x-6}" y="${y-6}" width="12" height="12" transform="rotate(45 ${x} ${y})"`:`<circle cx="${x}" cy="${y}" r="7"`;
    return `${sh} fill="${fill}" fill-opacity="${b.on?1:.85}" stroke="${stroke}" stroke-width="1.5" tabindex="0" data-tip="<b>${esc(b.h)}</b><br>${esc(b.g)}, ${esc(b.inn)} inning: ${esc(b.res)}<br>${tl}"/>`;
  }).join('');
  return fieldSVG(dots,'Spray chart of balls in play');
}

  <div><button type="button" class="btn" id="addgame">Add another game</button></div>
  <section class="card"><h2>2. Pick the team you’re scouting</h2>${choose}</section>
  <div style="display:flex;gap:10px;flex-wrap:wrap"><button type="button" class="btn primary" id="build" ${draft.opp&&teams.includes(draft.opp)?'':'disabled'}>${draft.target?'Add game to report':'Build scouting report'}</button><a class="btn" href="#reports">Cancel</a></div></div>`;
}
function encodeShare(r){ return btoa(unescape(encodeURIComponent(JSON.stringify({opp:r.opp,games:r.games,roster:rosters[r.id]||null})))); }
const b64u={enc:b=>{let s='';const a=new Uint8Array(b);for(let i=0;i<a.length;i+=8192)s+=String.fromCharCode.apply(null,a.subarray(i,i+8192));return btoa(s).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');},dec:s=>{s=s.replace(/-/g,'+').replace(/_/g,'/');while(s.length%4)s+='=';const t=atob(s);const a=new Uint8Array(t.length);for(let i=0;i<t.length;i++)a[i]=t.charCodeAt(i);return a;}};
async function packReport(r){ const bytes=new TextEncoder().encode(JSON.stringify({opp:r.opp,games:r.games,roster:rosters[r.id]||null}));
  if (window.CompressionStream){ try{ const buf=await new Response(new Blob([bytes]).stream().pipeThrough(new CompressionStream('deflate-raw'))).arrayBuffer(); return 'z'+b64u.enc(buf); }catch(e){} }
  return 'p'+b64u.enc(bytes); }
async function unpackReport(s){ const kind=s[0], bytes=b64u.dec(s.slice(1)); let txt;
  if (kind==='z'){ const buf=await new Response(new Blob([bytes]).stream().pipeThrough(new DecompressionStream('deflate-raw'))).arrayBuffer(); txt=new TextDecoder().decode(buf); }
  else txt=new TextDecoder().decode(bytes);
  const o=JSON.parse(txt); if(!o.opp||!Array.isArray(o.games)) throw new Error('bad'); return o; }
function importReport(o){ const same=reports.find(r=>r.opp===o.opp && r.games.length && o.games.length && r.games[0].text===o.games[0].text); let r;
  if (same){ same.games=o.games; same.updated=Date.now(); r=same; } else { r={id:'r'+Date.now(),opp:o.opp,games:o.games,updated:Date.now()}; reports.unshift(r); }
  store.set(STORE,reports); if(o.roster){ rosters[r.id]=o.roster; saveRoster(); } setActive(r.id); return r; }
let notice='';
function decodeShare(s){ const o=JSON.parse(decodeURIComponent(escape(atob(s.trim())))); if(!o.opp||!Array.isArray(o.games)) throw new Error('bad'); return o; }
function viewReports(){
  const cur=activeReport().id;
  const cards=allReports().map(r=>`<article class="report"><h3>${esc(r.opp)}</h3><span class="note">${r.games.length} game${r.games.length>1?'s':''}${r.sample?', sample report':''}${r.updated?', updated '+new Date(r.updated).toLocaleDateString():''}</span>
    <div class="actions"><button type="button" class="btn primary" data-open="${esc(r.id)}">${r.id===cur?'Open (current)':'Open'}</button><button type="button" class="btn" data-addto="${esc(r.id)}">Add a game</button><button type="button" class="btn" data-link="${esc(r.id)}">Send to another device</button><button type="button" class="btn" data-share="${esc(r.id)}">Share code</button>${r.sample?'':`<button type="button" class="btn" data-del="${esc(r.id)}">Delete</button>`}</div></article>`).join('');
  return `<div class="layout" style="grid-template-columns:1fr"><section class="stage"><h2>Your scouting reports</h2><p class="note">Reports are saved in this browser. To give one to another coach, use Share and send them the code.</p>
  <div style="display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px"><a class="btn primary" href="#new">New scouting report</a></div><div class="reports">${cards}</div></section>
  <section class="card" id="linkbox" hidden><h2>Send to another device</h2><p class="note">Open this link on your iPad, phone or another computer. The report, roster changes and notes load there automatically. Links work on your Dugout Scout website address.</p><textarea id="linktext" readonly style="min-height:80px" aria-label="Report link"></textarea><p style="margin:8px 0 0;display:flex;gap:8px;flex-wrap:wrap;align-items:center"><button type="button" class="btn primary" id="linkshare" hidden>Share link</button><button type="button" class="btn" id="linkcopy">Copy link</button><span id="linkmsg"></span></p></section>
  <section class="card" id="sharebox" hidden><h2>Share code</h2><p class="note">Copy this whole code and send it to another coach. They paste it below on their copy of the site.</p><textarea id="sharecode" readonly style="min-height:110px"></textarea></section>
  <section class="card"><h2>Open a report another coach shared</h2><p class="note">Paste the share code you were sent.</p><textarea id="importcode" style="min-height:90px" aria-label="Share code"></textarea><p style="margin:8px 0 0"><button type="button" class="btn" id="import">Add report</button> <span id="importmsg"></span></p></section></div>`;
}

/* ---------- shell ---------- */
const REPORT_VIEWS={plan:viewPlan,spray:viewSpray,counts:viewCounts,running:viewRunning,pitchers:viewPitchers,roster:viewRoster};
function renderHead(v){
  const r=activeReport(), inReport=!!REPORT_VIEWS[v];
  const tabs=[['plan','Game plan'],['spray','Hitters & spray'],['counts','Count tendencies'],['running','Baserunning'],['pitchers','Pitchers'],['roster','Roster']];
  head.innerHTML=`<div class="topbar"><a class="brand" href="#reports">Dugout Scout</a><div class="toplinks"><a class="btn ghost" href="#reports">All reports</a><a class="btn ghost" href="#new">New report</a></div></div>
  ${inReport?`<h1>${esc(r.opp)}</h1><p class="sub">Scouting from ${r.games.length} game${r.games.length>1?'s':''}: ${r.games.map(g=>esc(g.label)).join(', ')}${r.sample?'. Sample report.':''}</p>
  <nav class="tabs" aria-label="Report sections">${tabs.map(([k,t])=>`<a href="#${k}" ${k===v?'aria-current="page"':''}>${t}</a>`).join('')}</nav>`
  :`<h1>${v==='new'?(draft.target?'Add a game':'New scouting report'):'Scouting reports'}</h1><p class="sub">Paste GameChanger play-by-play. Get spray charts, count tendencies, baserunning and a game plan.</p><div style="height:18px"></div>`}`;
}
function render(){
  let v=(location.hash||'').slice(1);
  if (!v) v='plan';
  if (!REPORT_VIEWS[v] && v!=='new' && v!=='reports') v='plan';
  renderHead(v);
  let html='';
  try { html = REPORT_VIEWS[v] ? REPORT_VIEWS[v](getModel()) : v==='new' ? viewNew() : viewReports(); }
  catch(e){ html=`<div class="card" style="margin-top:24px"><h2>This report couldn’t be built</h2><p>${esc(e.message)}</p><p>Check that each game was pasted in full, then rebuild it from New report.</p></div>`; }
  if (notice){ html=`<p class="card" role="status" style="margin:24px 0 0">${notice}</p>`+html; notice=''; }
  app.innerHTML = html + `<footer>Built from GameChanger play-by-play. Logs that stop mid-game give partial numbers, so treat every read as a lead to confirm. Spray spots are placed by the fielder who played the ball. Scoring: 1B 2B 3B HR, BB, HBP, K swinging, ꓘ looking, FC, E#, double plays by position (4-6-3 DP), and fielder numbers (6-3, F8, L3, P1).</footer>`;
  tip.style.display='none'; bindTips(app); wire(v);
}
function wire(v){
  app.querySelectorAll('[data-game]').forEach(b=>b.onclick=()=>{state.game=b.dataset.game;render();});
  app.querySelectorAll('[data-pick]').forEach(s=>s.onchange=()=>{state[s.dataset.pick]=s.value;render();});
  app.querySelectorAll('tr[data-runner]').forEach(t=>{const go=()=>{state.runner=t.dataset.runner;render();scrollTo({top:0,behavior:'smooth'});};t.onclick=go;t.onkeydown=e=>{if(e.key==='Enter')go();};});
  app.querySelectorAll('[data-allhitters]').forEach(b=>b.onclick=()=>{state.hitter='all';render();});
  app.querySelectorAll('tr[data-hitter]').forEach(t=>{const go=()=>{state.hitter=t.dataset.hitter;render();scrollTo({top:0,behavior:'smooth'});};t.onclick=go;t.onkeydown=e=>{if(e.key==='Enter')go();};});
  if (v==='roster'){
    app.querySelectorAll('[data-inc]').forEach(c=>c.onchange=()=>{ const R=roster(), n=c.dataset.inc; R.removed=R.removed.filter(x=>x!==n); if(!c.checked) R.removed.push(n); saveRoster(); model=null; render(); });
    app.querySelectorAll('[data-info]').forEach(f=>f.onchange=()=>{ const R=roster(), n=f.dataset.name; R.info[n]=R.info[n]||{}; R.info[n][f.dataset.info]=f.value.trim(); saveRoster(); });
    app.querySelectorAll('[data-delplayer]').forEach(b=>b.onclick=()=>{ const R=roster(), n=b.dataset.delplayer, added=R.added.includes(n);
      if(!confirm(added?'Delete '+n+' from the roster?':'Delete '+n+'? His plays will be left out of every tab. You can restore him at the bottom of the roster.'))return;
      R.removed=R.removed.filter(x=>x!==n);
      if(added){ R.added=R.added.filter(x=>x!==n); delete R.info[n]; } else if(!R.deleted.includes(n)) R.deleted.push(n);
      saveRoster(); model=null; render(); });
    app.querySelectorAll('[data-restore]').forEach(b=>b.onclick=()=>{ const R=roster(), n=b.dataset.restore; R.deleted=R.deleted.filter(x=>x!==n); saveRoster(); model=null; render(); });
    $('#np-add').onclick=()=>{ const R=roster(), n=$('#np-name').value.trim().replace(/\s+/g,' '), msg=$('#np-msg'); const F=getFull();
      if(!n){ msg.className='err'; msg.textContent='Type the player’s name first.'; return; }
      if(R.deleted.includes(n)){ R.deleted=R.deleted.filter(x=>x!==n); saveRoster(); model=null; render(); return; }
      const exists=R.added.includes(n)||F.hitters[n]||F.pitchers.some(p=>p.n===n);
      if(exists){ msg.className='err'; msg.textContent=n+' is already on the roster.'; return; }
      R.added.push(n); R.info[n]={num:$('#np-num').value.trim(),pos:$('#np-pos').value.trim(),bats:$('#np-bats').value,notes:$('#np-notes').value.trim()}; R.removed=R.removed.filter(x=>x!==n); saveRoster(); render(); };
  }
  if (v==='new'){
    app.querySelectorAll('[data-gtext]').forEach(t=>{t.oninput=()=>{draft.games[+t.dataset.gtext].text=t.value;}; t.onchange=()=>{draft.games[+t.dataset.gtext].text=t.value;render();}; t.onpaste=()=>setTimeout(()=>{draft.games[+t.dataset.gtext].text=t.value;render();},0);});
    app.querySelectorAll('[data-glabel]').forEach(t=>t.oninput=()=>{draft.games[+t.dataset.glabel].label=t.value;});
    app.querySelectorAll('[data-gremove]').forEach(b=>b.onclick=()=>{draft.games.splice(+b.dataset.gremove,1);render();});
    app.querySelectorAll('input[name=opp]').forEach(r=>r.onchange=()=>{draft.opp=r.value;render();});
    $('#addgame').onclick=()=>{draft.games.push({label:'G'+(draft.games.length+1),text:''});render();};
    $('#build').onclick=()=>{
      const games=draft.games.filter(g=>g.text.trim()).map((g,i)=>({label:(g.label||'').trim()||('G'+(i+1)),text:g.text}));
      let r;
      if (draft.target){ r=reports.find(x=>x.id===draft.target); if(r){ r.games=r.games.concat(games); r.updated=Date.now(); } }
      if (!r){ r={id:'r'+Date.now(),opp:draft.opp,games,updated:Date.now()}; reports.unshift(r); }
      store.set(STORE,reports); setActive(r.id); draft={games:[{label:'G1',text:''}],opp:null}; location.hash='#plan';
    };
  }
  if (v==='reports'){
    app.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>{setActive(b.dataset.open);location.hash='#plan';});
    app.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{ if(!confirm('Delete this report from this browser?'))return; reports=reports.filter(r=>r.id!==b.dataset.del); store.set(STORE,reports); if(activeReport().id===b.dataset.del) setActive(SAMPLE.id); render();});
    app.querySelectorAll('[data-addto]').forEach(b=>b.onclick=()=>{ const src=allReports().find(r=>r.id===b.dataset.addto);
      if (src.sample){ const copy={id:'r'+Date.now(),opp:src.opp,games:src.games.slice(),updated:Date.now()}; reports.unshift(copy); store.set(STORE,reports); draft={games:[{label:'G'+(copy.games.length+1),text:''}],opp:src.opp,target:copy.id}; }
      else draft={games:[{label:'G'+(src.games.length+1),text:''}],opp:src.opp,target:src.id};
      location.hash='#new'; });
    app.querySelectorAll('[data-link]').forEach(b=>b.onclick=async()=>{ const r=allReports().find(x=>x.id===b.dataset.link); const box=$('#linkbox'), t=$('#linktext'), msg=$('#linkmsg'); box.hidden=false; msg.textContent='Making link…'; msg.className='note';
      const link=location.origin+location.pathname+'#r='+await packReport(r); t.value=link; msg.textContent='';
      const sh=$('#linkshare'); if(navigator.share){ sh.hidden=false; sh.onclick=()=>navigator.share({title:'Dugout Scout: '+r.opp,url:link}).catch(()=>{}); }
      $('#linkcopy').onclick=async()=>{ let ok=false; try{ await navigator.clipboard.writeText(link); ok=true; }catch(e){ t.focus(); t.select(); try{ ok=document.execCommand('copy'); }catch(e2){} } msg.className=ok?'ok':'note'; msg.textContent=ok?'Copied. Send it to yourself by text, email or AirDrop.':'Select the link above and copy it.'; };
      box.scrollIntoView({behavior:'smooth'}); });
    app.querySelectorAll('[data-share]').forEach(b=>b.onclick=()=>{ const r=allReports().find(x=>x.id===b.dataset.share); const box=$('#sharebox'); box.hidden=false; const t=$('#sharecode'); t.value=encodeShare(r); t.focus(); t.select(); try{ navigator.clipboard&&navigator.clipboard.writeText(t.value);}catch(e){} box.scrollIntoView({behavior:'smooth'}); });
    $('#import').onclick=()=>{ const msg=$('#importmsg'); try{ const o=decodeShare($('#importcode').value); const r={id:'r'+Date.now(),opp:o.opp,games:o.games,updated:Date.now()}; reports.unshift(r); store.set(STORE,reports); if(o.roster){ rosters[r.id]=o.roster; saveRoster(); } setActive(r.id); location.hash='#plan'; }catch(e){ msg.className='err'; msg.textContent='That code didn’t work. Copy the whole code and try again.'; } };
  }
}
let touchMode=false;
addEventListener('pointerdown',e=>{ touchMode = e.pointerType!=='mouse'; },true);
addEventListener('touchstart',()=>{ touchMode=true; },{capture:true,passive:true});
addEventListener('click',()=>{ tip.style.display='none'; });
async function boot(){ const h=location.hash;
  if (h.startsWith('#r=')){ try{ const o=await unpackReport(h.slice(3)); const r=importReport(o); notice=`<span class="ok">Added “${esc(r.opp)}” to this device.</span> It’s saved here now, so you can open it from All reports anytime.`; history.replaceState(null,'',location.pathname+location.search+'#plan'); }
    catch(e){ notice='<span class="err">That report link didn’t open.</span> Make sure the whole link was copied, then try again.'; history.replaceState(null,'',location.pathname+location.search+'#reports'); } }
  render(); }
addEventListener('hashchange',()=>{ if(location.hash.startsWith('#r=')) return boot(); if(location.hash==='#new' && !draft.target && draft.games.every(g=>!g.text)) draft={games:[{label:'G1',text:''}],opp:null}; render(); });
boot();
</script>
</body>
</html>
